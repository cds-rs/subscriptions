[workspace]
members = [
    "program",
    "clients/rust",
    "scenarios",
    "tests/integration-tests",
    "tests/observed",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/solana-foundation/subscriptions"

[workspace.metadata.cli]
solana = "3.1.10"

[workspace.lints.rust]
unused_imports = "deny"
dead_code = "warn"
unused_variables = "warn"
deprecated = "warn"
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(target_os, values("solana"))',
] }

[workspace.dependencies]
codama = "0.9.2"
const-crypto = "0.3"
pinocchio = { version = "0.11.1", features = ["cpi", "copy"] }
pinocchio-associated-token-account = "0.4.0"
pinocchio-system = "0.6.1"
pinocchio-token = "0.6.0"
pinocchio-token-2022 = "0.3.1"
serde_json = "1"
solana-address = { version = "2", features = ["curve25519"] }
solana-program-pack = "3"
solana-security-txt = "1.1.3"
spl-token-interface = "3.0.0"
thiserror = { version = "2", default-features = false }

[profile.release]
overflow-checks = true
opt-level = 3
lto = true
codegen-units = 1

# Repoint litesvm to the cds-rs fork (litesvm 0.12.0 + the
# `invocation-inspect-callback` hook the observability foundation needs). Pinned
# to the exact rev the local fingerprint anchor-litesvm workspace uses, so the
# path-dep'd litesvm-utils and the suite's own litesvm/litesvm-token resolve to
# ONE litesvm (a floating `branch = main` drifts to a newer rev than fingerprint
# pins, yielding two incompatible `litesvm` types in the graph).
[patch.crates-io]
litesvm = { git = "https://github.com/cds-rs/litesvm", rev = "03bb2ff3e49321b9d62c7f91b4d0d6c1548b8be6" }
