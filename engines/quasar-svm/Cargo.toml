# SPIKE: isolated workspace root. quasar-svm drags the full Agave internals,
# which cannot share the main subscriptions lockfile (excluded there). Same
# scenarios harness, different backend, separate lock.
[package]
name = "subscriptions-quasar-spike"
version = "0.1.0"
edition = "2021"

[dependencies]
scenarios = { path = "../../scenarios" }
testsvm = { path = "/Users/amal/oss/upstream/anchor-litesvm/crates/testsvm" }
testsvm-quasar = { path = "/Users/amal/oss/upstream/anchor-litesvm/crates/testsvm-quasar" }
solana-instruction = "3.2"
solana-keypair = "3.1"
solana-pubkey = "3.0"
solana-signer = "3.0"

[dev-dependencies]
# The initialize binding hosts the Token-2022 `rstest` (one `#[test]` per
# extension set); `bind_scenarios!` cannot emit a parametrized test, so the shim
# lives in the binding and needs these two directly.
rstest = "0.26"
spl-token-2022-interface = "3.0.0"

[workspace]
